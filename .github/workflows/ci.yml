name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partner
          POSTGRES_PASSWORD: partner
          POSTGRES_DB: partner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PX_TEST_DATABASE_URL: postgres://partner:partner@localhost:5432/partner_test?sslmode=disable
      PX_TEST_GCS_ENDPOINT: http://localhost:4443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start GCS emulator
        run: |
          docker run -d --name gcs -p 4443:4443 fsouza/fake-gcs-server:1.52.2 -scheme http -port 4443 -public-host localhost:4443
          for i in $(seq 1 20); do curl -fsS localhost:4443/storage/v1/b >/dev/null && break; sleep 1; done
      - name: Vet
        run: go vet ./...
      - name: Test (unit + PostgreSQL)
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile stack config -q
      - name: Smoke test the stack
        run: |
          docker compose --profile stack up -d --build
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/readyz && exit 0
            sleep 2
          done
          docker compose --profile stack logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose --profile stack down -v
